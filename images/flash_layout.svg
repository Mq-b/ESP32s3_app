<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif">
  <title>ESP32-S3 Flash 分区布局</title>
  <desc>8MiB Flash 的分区布局：bootloader、分区表、nvs、phy_init、factory、storage 与未分配空间；factory 为 3MiB，当前本地固件约 2.01MiB；SPIFFS 存放首页、扫码页面、网络配置及可选上传临时文件；示意高度不按容量比例绘制</desc>

  <rect x="0" y="0" width="640" height="480" rx="16" fill="#0f172a"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#e2e8f0">ESP32-S3 Flash 分区布局（8MiB）</text>

  <!-- 分区条 x=170 宽 200 -->
  <rect x="170" y="80" width="200" height="26" rx="5" fill="#3f3f46"/>
  <text x="156" y="97" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x000000</text>
  <text x="270" y="97" font-size="12" text-anchor="middle" fill="#d4d4d8">bootloader · 32KiB</text>
  <text x="386" y="97" font-size="12" fill="#94a3b8">引导程序</text>

  <rect x="170" y="106" width="200" height="24" rx="5" fill="#3f3f46"/>
  <text x="156" y="122" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x008000</text>
  <text x="270" y="122" font-size="12" text-anchor="middle" fill="#d4d4d8">分区表 · 4KiB</text>
  <text x="386" y="122" font-size="12" fill="#94a3b8">分区地图</text>

  <rect x="170" y="130" width="200" height="26" rx="5" fill="#854F0B"/>
  <text x="156" y="147" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x009000</text>
  <text x="270" y="147" font-size="12" text-anchor="middle" fill="#FAEEDA">nvs · 24KiB</text>
  <text x="386" y="147" font-size="12" fill="#FAC775">键值存储</text>

  <rect x="170" y="156" width="200" height="24" rx="5" fill="#854F0B"/>
  <text x="156" y="172" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x00F000</text>
  <text x="270" y="172" font-size="12" text-anchor="middle" fill="#FAEEDA">phy_init · 4KiB</text>
  <text x="386" y="172" font-size="12" fill="#FAC775">射频初始化预留</text>

  <rect x="170" y="180" width="200" height="110" rx="5" fill="#0C447C"/>
  <!-- 2026-10-04 本地构建产物：0x203D50，约占 3MiB factory 分区的 67.2% -->
  <rect x="170" y="180" width="200" height="73.9" rx="5" fill="#155E9A"/>
  <line x1="170" y1="253.9" x2="370" y2="253.9" stroke="#7DD3FC" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="156" y="190" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x010000</text>
  <text x="270" y="207" font-size="13" text-anchor="middle" font-weight="500" fill="#B5D4F4">factory · 3MiB</text>
  <text x="270" y="231" font-size="11" text-anchor="middle" fill="#BAE6FD">已用 2.01MiB（67.2%）</text>
  <text x="270" y="249" font-size="10" text-anchor="middle" fill="#7DD3FC">当前镜像 0x203D50</text>
  <text x="270" y="278" font-size="11" text-anchor="middle" fill="#85B7EB">剩余约 0.99MiB</text>
  <text x="386" y="238" font-size="12" fill="#85B7EB">应用固件</text>

  <rect x="170" y="290" width="200" height="64" rx="5" fill="#085041"/>
  <text x="156" y="300" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x310000</text>
  <text x="270" y="316" font-size="13" text-anchor="middle" font-weight="500" fill="#9FE1CB">storage · 1MiB</text>
  <text x="270" y="336" font-size="11" text-anchor="middle" fill="#5DCAA5">SPIFFS</text>
  <text x="386" y="304" font-size="11" fill="#5DCAA5">index.html / scanner.html</text>
  <text x="386" y="324" font-size="11" fill="#5DCAA5">wifi.json 配置</text>

  <text x="386" y="344" font-size="11" fill="#5DCAA5">barcode-upload.tmp（可选）</text>

  <rect x="170" y="354" width="200" height="84" rx="5" fill="none" stroke="#52525b" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="156" y="364" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x410000</text>
  <text x="270" y="392" font-size="12" text-anchor="middle" fill="#a1a1aa">未分配</text>
  <text x="270" y="410" font-size="11" text-anchor="middle" fill="#71717a">约 3.94MiB</text>
  <text x="386" y="399" font-size="12" fill="#71717a">空闲预留</text>

  <text x="156" y="452" font-size="11" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">0x800000</text>
  <text x="320" y="470" font-size="10" text-anchor="middle" fill="#94a3b8">示意高度不按容量比例；镜像占用为 2026-10-04 本地构建快照</text>
</svg>
